<header><div><strong>提案工作台</strong><small>从任务共识开始</small></div><a href="http://127.0.0.1:4180" target="_blank" rel="noopener">打开自动排版 ↗</a></header>
<div class="shell"><aside><p class="eyebrow">PROJECTS / 项目</p><button id="newProject" class="primary">＋ 新建项目</button><nav id="projects" class="projects" aria-label="项目列表"></nav></aside><main><div id="feedback" role="alert"></div><div class="notice" id="capabilities">本地项目、文字修订、资料核验及策略／文案模型评审已接入。未校准评分仅供诊断。自动检索、图片生成与完整提案串联仍未完成；确认任务卡不会启动生成。</div><div id="content"></div></main></div>
<script>
'use strict';
const labels={research:'调研与证据',strategy:'策略方向',copy:'文案内容',references:'视觉参考',sketch:'概念草图',visual:'视觉精绘',content_review:'排版前内容审核',layout:'提案排版',final_review:'交付前最终审核'};

let capabilities={stages:[]};

const disabledControls=new Map();
function el(tag,text,cls){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node}

function notice(text){feedback.replaceChildren(el('div',text,'notice'))}
function errorMessage(error){const codes={REVISION_CONFLICT:'项目已在其他窗口更新。请刷新最新版本，再重新确认你的修改。',STALE_ARTIFACT:'该成果已失效，请刷新项目并查看当前版本。',HARD_BLOCKER:'存在事实或生产问题，不能通过指定采用绕过。',STALE_SCOPE:'任务卡已更新，请刷新后确认当前任务卡。'};return codes[error.code]||error.message||'操作失败，请重试。'}
function lockControls(){
  document.querySelectorAll('button,input,select,textarea').forEach(control=>{
    if(!busy&&control.dataset.recovery)return;
    if(!disabledControls.has(control))disabledControls.set(control,control.disabled);
    control.disabled=true;
  });
}
function restoreControls(){
  for(const [control,disabled] of disabledControls){
    if(!pendingMutation||control.dataset.recovery){control.disabled=disabled;disabledControls.delete(control)}
  }
}
function showError(error){
  const box=el('div',undefined,'error');
  if(pendingMutation){
    box.append(el('p',pendingMutation.result?'保存已确认，但项目刷新失败。请重试加载。':'尚未确认保存结果，已保留本次提交。请重试同一请求；完成前暂时锁定编辑。'));

    retry.dataset.recovery='true';box.append(retry);
  }else{
    box.append(el('p',errorMessage(error)));
    if(error.code==='REVISION_CONFLICT'&&current)box.append(button('刷新最新版本',()=>openProject(current.project.id)));
  }

}
async function safe(action){
  if(busy)return;
  if(pendingMutation&&action!==finishMutation){showError(new Error('待确认保存'));return}

  const observer=new MutationObserver(lockControls);
  observer.observe(document.body,{childList:true,subtree:true});
  try{await action()}catch(error){showError(error)}finally{
    observer.disconnect();busy=false;
    if(pendingMutation)lockControls();
    restoreControls();
  }
}
async function api(path,data){
  const response=await fetch(path,{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json'}:{},body:data?(typeof data==='string'?data:JSON.stringify(data)):undefined});
  const body=await response.json();
  if(!response.ok){
    const error=new Error(typeof body.error==='string'?body.error:body.error?.message||body.message||'请求失败');
    error.code=body.code||body.error?.code;
    error.definitive=response.status>=400&&response.status<500&&typeof error.code==='string';
    throw error;
  }
  return body;
}
async function finishMutation(){
  const pending=pendingMutation;
  if(!pending)return;
  if(!pending.result){
    try{
      const result=await api(pending.path,pending.body);
      if(!result?.project?.id)throw new Error('保存响应不完整');
      pending.result=result;
    }catch(error){if(error.definitive)pendingMutation=null;throw error}
  }
  await openProject(pending.result.project.id,false);
  pendingMutation=null;
  notice(pending.message);
}
async function mutate(path,payload,message){
  pendingMutation={path,body:JSON.stringify(payload),message,result:null};
  await finishMutation();
}

async function listProjects(){const data=await api('/api/projects');const nav=document.querySelector('#projects');nav.replaceChildren();for(const p of data.projects){const b=button('',()=>openProject(p.id));b.className='project'+(current?.project.id===p.id?' active':'');b.append(el('span',p.name),el('small','版本 '+p.revision));nav.append(b)}if(!data.projects.length)nav.append(el('p','还没有项目。','muted'))}
function createScreen(){if(!allowNavigation())return;loadToken++;current=null;historical=false;dirty=false;feedback.replaceChildren();content.replaceChildren();const intro=el('div',undefined,'intro');const title=el('div');title.append(el('p','NEW PROJECT / 开始一个提案','eyebrow'),el('h1','先说清楚，要解决什么。'),el('p','保存 Brief 后，确认任务卡并设置你希望参与的节点。','muted'));intro.append(title);content.append(intro);const form=el('form',undefined,'card'),name=el('input'),brief=el('textarea');name.type='text';name.required=true;name.maxLength=160;name.placeholder='例如：品牌春节传播提案';brief.required=true;brief.placeholder='项目背景、目标人群、需要解决的问题、交付形式，以及已知限制。';const policy=policyFields();form.append(field('项目名称',name),field('项目 Brief',brief),policy.node);const submit=el('button','创建项目','primary');submit.type='submit';form.append(submit);track(form);form.onsubmit=e=>{e.preventDefault();safe(async()=>{await mutate('/api/projects',{commandId:crypto.randomUUID(),name:name.value.trim(),brief:brief.value.trim(),...policy.read()},'项目已保存。请核对并确认任务卡。')})};content.append(form)}
async function openProject(id,checkDirty=true,revision){if(checkDirty&&!allowNavigation())return;const token=++loadToken;const result=await api('/api/projects/'+encodeURIComponent(id)+(revision===undefined?'':'?revision='+revision));if(token!==loadToken)return;current=result;historical=revision!==undefined;if(!historical)latestRevision=result.project.revision;dirty=false;feedback.replaceChildren();renderProject();await listProjects()}

function renderProject(){const {project:p,view:v}=current;content.replaceChildren();const intro=el('div',undefined,'intro'),heading=el('div');heading.append(el('p','PROJECT / 项目工作台','eyebrow'),el('h1',p.name),el('p','项目版本 '+p.revision+' · '+(v.policy.mode==='auto'?'自动模式':'辅助模式'),'muted'));const version=el('select');version.setAttribute('aria-label','查看项目版本');const latest=el('option','最新版本');latest.value='latest';version.append(latest);for(let n=latestRevision;n>=0;n--){const o=el('option','历史版本 '+n);o.value=String(n);version.append(o)}version.value=historical?String(p.revision):'latest';version.onchange=()=>safe(async()=>{const selected=version.value;await openProject(p.id,true,selected==='latest'?undefined:Number(selected));version.value=historical?String(current.project.revision):'latest'});const revision=el('div',undefined,'revision');revision.append(version,button('刷新',()=>openProject(p.id,true,historical?p.revision:undefined)));intro.append(heading,revision);content.append(intro);if(historical)content.append(el('div','正在查看历史快照，仅供阅读。请切回最新版本进行修改或确认。','notice'));
const grid=el('div',undefined,'grid'),scope=el('section',undefined,'card');scope.append(el('h2','任务卡'));const confirmed=p.confirmations.some(c=>c.taskCardId===p.activeTaskCardId);scope.append(el('span',confirmed?'已确认':'等待确认','badge'),el('p',v.taskCard.brief,'brief'));if(!historical){const actions=el('div',undefined,'actions');if(!confirmed)actions.append(button('确认这份任务卡',()=>command('confirm-task-card',{taskCardId:p.activeTaskCardId}),true));actions.append(button('修改 Brief',()=>editBrief(scope,p,v)));scope.append(actions)}const policyCard=el('section',undefined,'card');policyCard.append(el('h2','我的参与节点'));if(historical){policyCard.append(el('p',v.policy.humanGates.map(k=>labels[k]).join('、')||'未设置人工节点','brief'))}else{const form=el('form'),policy=policyFields(v.policy);form.append(policy.node);const save=el('button','保存模式与节点');save.type='submit';form.append(save);track(form);form.onsubmit=e=>{e.preventDefault();safe(()=>command('set-policy',policy.read(),form))};policyCard.append(form)}grid.append(scope,policyCard);content.append(grid);const stages=el('section',undefined,'card');stages.style.marginTop='20px';stages.append(el('h2','阶段进度'),el('p','“可进入”表示前置条件满足。仅已接入的文字阶段可执行。生成完成后仍需证据核验、独立评审与交接。','muted'));const timeline=el('div',undefined,'timeline');v.stages.forEach((s,i)=>{const step=el('div',undefined,'step'),title=el('strong',(i+1)+'. '+labels[s.stage]);title.append(el('span',statusLabels[s.status]||s.status,'status'));step.append(title);s.blockedReasons.forEach(r=>step.append(el('small',reasonLabels[r]||r)));timeline.append(step)});stages.append(timeline);content.append(stages);renderSources(p);renderImages(p,v);renderExecution(p,v);renderArtifacts(p,v);renderReferences(p,v);const history=el('section',undefined,'card');history.append(el('h2','版本与记录'),el('p','每次修改与决定保留原记录。指定采用不会修改原始评审分数。','muted'),detail('查看操作记录（'+p.audit.length+'）',p.audit),detail('查看已存决定与绘制授权',{decisions:p.decisions,visualAuthorizations:p.visualAuthorizations}),detail('查看全部成果版本（'+p.artifacts.length+'）',p.artifacts));content.append(history)}
function renderReferences(p,v){
 const section=el('section',undefined,'card'),route='/api/projects/'+encodeURIComponent(p.id);section.append(el('h2','参考图工作台'),el('p','原图仅用于明确范围的视觉借鉴。模型评审不是客户批准或真实消费者研究；未校准报告会保留诊断状态。','muted'));
